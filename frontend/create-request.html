<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Request · Community Connect</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-card" style="width:min(700px,100%)"><a class="brand" href="dashboard.html"><span class="brand-mark">CC</span>Community Connect</a><h1>Request help</h1><div id="resource-context" class="alert" style="display:none;margin-bottom:15px"></div><div id="form-alert" class="hidden"></div><form id="request-form"><input type="hidden" id="resourceId"><div class="field"><label>Request title</label><input id="title" required></div><div class="field"><label>Description</label><textarea id="description" required></textarea></div><div class="form-grid"><div class="field"><label>Required skills</label><input id="skills" placeholder="C++, DSA"></div><div class="field"><label>Related category</label><select id="category" required><option value="">Choose category</option></select></div><div class="field"><label>Priority</label><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div></div><button class="btn btn-primary">Create request</button><a class="btn btn-ghost" href="requests.html">Cancel</a></form></div><script src="js/api.js"></script><script src="js/auth.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!await requireAuth())return;const params=new URLSearchParams(location.search);const resourceId=params.get('resourceId')||'';const resourceTitle=params.get('title')||'';const resourceCategory=params.get('category')||'';document.getElementById('resourceId').value=resourceId;const context=document.getElementById('resource-context');if(resourceId){context.style.display='block';context.innerHTML=`Requesting help for <strong>${resourceTitle.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</strong>. The resource owner will receive this request. Contact details become available after the request is accepted.`;if(resourceTitle)document.getElementById('title').value=`Help with ${resourceTitle}`;}const categoryEl=document.getElementById('category');try{const d=await API.categories();(d.categories||d||[]).forEach(c=>categoryEl.insertAdjacentHTML('beforeend',`<option value="${c}">${c}</option>`));if(resourceCategory)categoryEl.value=resourceCategory}catch{}});document.getElementById('request-form').addEventListener('submit',async e=>{e.preventDefault();const titleEl=document.getElementById('title');const descriptionEl=document.getElementById('description');const skillsEl=document.getElementById('skills');const categoryEl=document.getElementById('category');const priorityEl=document.getElementById('priority');const resourceIdEl=document.getElementById('resourceId');try{await API.createRequest({resourceId:Number(resourceIdEl.value||0),title:titleEl.value.trim(),description:descriptionEl.value.trim(),requiredSkills:skillsEl.value.split(',').map(x=>x.trim()).filter(Boolean),category:categoryEl.value,priority:priorityEl.value});showMessage('form-alert','Request created successfully.','success');setTimeout(()=>location.href='requests.html',500)}catch(err){showMessage('form-alert',err.message)}})</script></body></html>
