<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · Community Connect</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-card" style="width:min(700px,100%)"><a class="brand" href="index.html"><span class="brand-mark">CC</span>Community Connect</a><h1>Create your account</h1><p class="muted">One account can both share resources and request help.</p><div id="form-alert" class="hidden"></div><form id="register-form" class="form-grid"><div class="field"><label>Full name</label><input id="name" required></div><div class="field"><label>Username</label><input id="username" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" required></div><div class="field"><label>City</label><input id="city" required></div><div class="field"><label>Locality (optional)</label><input id="locality"></div><div class="field"><label>Skills</label><input id="skills" placeholder="C++, DSA, Java"></div><div class="field"><label>Interests</label><input id="interests" placeholder="Web development, AI"></div><div class="field"><label>Contact phone (private until accepted)</label><input id="contactPhone" type="tel"></div><div class="field full"><button class="btn btn-primary">Create account</button></div></form><p class="muted">Already registered? <a href="login.html" style="color:var(--primary);font-weight:700">Log in</a></p></div><script src="js/api.js"></script><script src="js/auth.js"></script><script>document.getElementById('register-form').addEventListener('submit',async e=>{e.preventDefault();const nameEl=document.getElementById('name');const usernameEl=document.getElementById('username');const emailEl=document.getElementById('email');const passwordEl=document.getElementById('password');const confirmPasswordEl=document.getElementById('confirmPassword');const cityEl=document.getElementById('city');const localityEl=document.getElementById('locality');const skillsEl=document.getElementById('skills');const interestsEl=document.getElementById('interests');const contactPhoneEl=document.getElementById('contactPhone');if(passwordEl.value!==confirmPasswordEl.value){showMessage('form-alert','Passwords do not match');return}try{const d=await API.register({name:nameEl.value.trim(),username:usernameEl.value.trim(),email:emailEl.value.trim(),password:passwordEl.value,city:cityEl.value.trim(),locality:localityEl.value.trim(),skills:skillsEl.value.trim(),interests:interestsEl.value.trim(),contactPhone:contactPhoneEl.value.trim()});Auth.setToken(d.token||d.sessionToken||'');localStorage.setItem('cc_user',JSON.stringify(d.user||{}));location.href='dashboard.html'}catch(err){showMessage('form-alert',err.message)}})</script></body></html>
