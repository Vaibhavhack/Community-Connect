<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Details · Community Connect</title><link rel="stylesheet" href="css/style.css"></head><body><main class="page"><div class="container"><a href="requests.html" class="btn btn-ghost">← Back to requests</a><div id="content" class="card" style="margin-top:15px">Loading...</div></div></main><script src="js/api.js"></script><script src="js/auth.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!await requireAuth())return;const id=new URLSearchParams(location.search).get('id');const c=document.getElementById('content');try{const d=await API.request(id);const r=d.request||d;c.innerHTML=`<h1>${r.title||r.requestTitle}</h1><p>${r.description||''}</p><p><strong>Priority:</strong> ${r.priority}</p><p><strong>Status:</strong> <span class="badge">${r.status}</span></p><p class="muted">Required skills: ${Array.isArray(r.requiredSkills) ? r.requiredSkills.join(', ') : (r.requiredSkills || '')}</p><div class="actions">${r.status==='Pending'?`<button id="accept" class="btn btn-success">Accept</button><button id="reject" class="btn btn-danger">Reject</button><button id="cancel" class="btn btn-secondary">Cancel</button>`:''}${r.status==='Accepted'?'<button id="complete" class="btn btn-success">Mark completed</button>':''}</div><div id="contact" style="margin-top:18px"></div>`;if(r.status==='Accepted'){try{const ct=await API.requestContact(id);const x=ct.contact||ct;document.getElementById('contact').innerHTML=`<div class="alert alert-success">Contact: ${x.email||''} ${x.phone?' · '+x.phone:''}</div>`}catch{}}document.getElementById('accept')?.addEventListener('click',async()=>{await API.acceptRequest(id);location.reload()});document.getElementById('reject')?.addEventListener('click',async()=>{await API.rejectRequest(id);location.reload()});document.getElementById('cancel')?.addEventListener('click',async()=>{await API.cancelRequest(id);location.reload()});document.getElementById('complete')?.addEventListener('click',async()=>{await API.completeRequest(id);location.reload()})}catch(e){c.textContent=e.message}})</script></body></html>
