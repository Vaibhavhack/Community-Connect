<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Resource · Community Connect</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-page"><div class="auth-card" style="width:min(700px,100%)"><a class="brand" href="dashboard.html"><span class="brand-mark">CC</span>Community Connect</a><h1>Add an educational resource</h1><div id="form-alert" class="hidden"></div><form id="resource-form"><div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Category</label><select id="category" required><option value="">Choose category</option></select></div><div class="field"><label>Description</label><textarea id="description" required></textarea></div><button class="btn btn-primary">Publish resource</button><a class="btn btn-ghost" href="resources.html">Cancel</a></form></div></main><script src="js/api.js"></script><script src="js/auth.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!await requireAuth())return;const categoryEl=document.getElementById('category');try{const d=await API.categories();(d.categories||d||[]).forEach(c=>categoryEl.insertAdjacentHTML('beforeend',`<option value="${c}">${c}</option>`))}catch{}});document.getElementById('resource-form').addEventListener('submit',async e=>{e.preventDefault();const titleEl=document.getElementById('title');const descriptionEl=document.getElementById('description');const categoryEl=document.getElementById('category');try{await API.createResource({title:titleEl.value.trim(),description:descriptionEl.value.trim(),category:categoryEl.value});showMessage('form-alert','Resource added successfully.','success');setTimeout(()=>location.href='resources.html',500)}catch(err){showMessage('form-alert',err.message)}})</script></body></html>
