<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Community Connect</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">CC</span>Community Connect</a><h1>Welcome back</h1><p class="muted">Sign in to your community account.</p><div id="form-alert" class="hidden"></div><form id="login-form"><div class="field"><label>Username or Email</label><input id="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn btn-primary" style="width:100%">Log in</button></form><p class="muted">New here? <a href="register.html" style="color:var(--primary);font-weight:700">Create an account</a></p></div><script src="js/api.js"></script><script src="js/auth.js"></script><script>document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const loginEl=document.getElementById('email');const passwordEl=document.getElementById('password');try{const d=await API.login({login:loginEl.value.trim(),password:passwordEl.value});Auth.setToken(d.token||d.sessionToken||'');localStorage.setItem('cc_user',JSON.stringify(d.user||{}));location.href='dashboard.html'}catch(err){showMessage('form-alert',err.message)}})</script></body></html>
