<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource Details · Community Connect</title><link rel="stylesheet" href="css/style.css"></head><body><main class="page"><div class="container"><a href="resources.html" class="btn btn-ghost">← Back to resources</a><div id="content" class="card" style="margin-top:15px">Loading...</div></div></main><script src="js/api.js"></script><script src="js/auth.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!await requireAuth())return;const id=new URLSearchParams(location.search).get('id');try{const d=await API.resource(id);const r=d.resource||d;document.getElementById('content').innerHTML=`<span class="badge">${r.category}</span><h1>${r.title}</h1><p class="muted">Added ${r.dateAdded||''}</p><p>${r.description||''}</p><span class="badge ${r.available===false?'danger':'success'}">${r.available===false?'Unavailable':'Available'}</span>`}catch(e){document.getElementById('content').textContent=e.message}})</script></body></html>
